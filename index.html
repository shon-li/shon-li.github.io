---
indexPage : true
copyright : false
# title   : 索引 Index
---
{%- for category in site.data.categories -%}

  <h1 class="contents-title">{{- category.name -}}</h1>

  <ul class="contents-list">
    {%- for post in site.categories[category.keyword] -%}
      <li>
        <a href="{{- post.url -}}">{{- post.title -}}</a>
        <time class="contents-date" datetime="{{ post.date | date: '%Y-%m' }}">{{- post.date | date: "%Y-%m" -}}</time>
      </li>
    {%- endfor -%}
  </ul>

{%- endfor -%}
