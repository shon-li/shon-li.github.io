<nav id="floating-nav">
  {%- for item in site.data.navigation -%}
    {%- if item.link != page.url -%}
      <a href="{{- item.link -}}">{{- item.name -}}</a>
    {%- endif -%}
  {%- endfor -%}
  {%- if page.date -%}
    <a href="#" id="scroll-to-top">转到最上面 GO-TO-PAGE-TOP</a>
  {%- endif -%}
</nav>

<script>
  (function () {
    var nav = document.getElementById('floating-nav');
    var paper = document.querySelector('main');
    var timer;

    function hide() {
      nav.classList.remove('is-visible');
    }

    function show() {
      nav.classList.add('is-visible');
    }

    function resetTimer() {
      show();
      clearTimeout(timer);
      timer = setTimeout(hide, 5000);
    }

    nav.addEventListener('mouseenter', function () {
      clearTimeout(timer);
      show();
    });

    nav.addEventListener('mouseleave', function () {
      timer = setTimeout(hide, 5000);
    });

    function positionNav() {
      if (!paper) return;
      var rect = paper.getBoundingClientRect();
      var navH = nav.offsetHeight;
      var gap = 16;

      nav.style.left = (rect.right + gap) + 'px';

      var idealTop = window.innerHeight - navH - gap;
      var minTop = rect.top;
      var maxTop = rect.bottom - navH;
      if (maxTop < minTop) maxTop = minTop;

      var top = Math.min(Math.max(idealTop, minTop), maxTop);
      nav.style.top = top + 'px';

      if (idealTop >= maxTop) {
        clearTimeout(timer);
        show();
      }
    }

    window.addEventListener('scroll', function () {
      resetTimer();
      positionNav();
    }, { passive: true });

    window.addEventListener('resize', positionNav, { passive: true });

    positionNav();
    resetTimer();

    var scrollTop = document.getElementById('scroll-to-top');
    if (scrollTop) {
      scrollTop.addEventListener('click', function (e) {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  })();
</script>
