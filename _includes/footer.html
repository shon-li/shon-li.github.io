<footer
  {% if page.figure %}
    class="figure-page-footer"
  {%- endif -%}
>

  {%- if page.date -%}
    {{- page.date | date: "%Y-%m-%-d" -}}
  {%- else -%}
    {{- site.time | date: "%Y-%m" -}}
  {%- endif -%}

  &#32;・&#32;
  {%- if page.copyright -%}
    {{- site.author -}}
  {%- else -%}
    {{- site.title -}}
  {%- endif -%}

  {%- if page.copyright -%}
    &#32;・&#32;CC BY-NC-SA 4.0
  {%- endif -%}

</footer>
