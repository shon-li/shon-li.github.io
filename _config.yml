# Site SEO information
title: "晓航的博客 Shon's Blog"
author: "李晓航 Shon Li"
description: "晓航的个人博客，收录照片与文字。Shon's personal blog of photos and words."

# URLs
url: "https://shon.li"
permalink: /:categories/:title:output_ext

# Default front matter for all pages and posts
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      lang: "zh-Hans"
      copyright: true

# Config for compress-html layout
compress_html:
  clippings: all
  comments: []
  endings: all
  ignore:
    envs: []
  blanklines: false
  profile: false
  startings: []

# Sass
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
